name: Fork Windows build

# Builds the fork's unsigned Windows installer on a hosted runner. Upstream's
# release workflows need its self-hosted runners and signing secrets.
on:
  workflow_dispatch:
  push:
    branches: [fork]
  pull_request:
    branches: [fork]

permissions:
  contents: read

concurrency:
  group: fork-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Windows test binary needs a common-controls manifest embedded before it
  # can start (see validate-windows.yml), so the Rust checks run on Linux.
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RBXPORT_FORK: "1"
      RBXPORT_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libgtk-3-dev libasound2-dev libdbus-1-dev
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: mkdir -p dist
      - run: cargo clippy -p rbxport --lib --tests -- -D warnings
      - run: cargo test -p rbxport --lib

  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RBXPORT_FORK: "1"
      RBXPORT_TEST: "1"
      CARGO_TARGET_DIR: C:\t
    steps:
      - name: Long paths, and LF endings as the sources are written
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> C:\\t"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm budget
      - name: Build installer
        run: pnpm tauri build --bundles nsis --config src-tauri/tauri.fork.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: rbxport-fork-windows
          path: C:\t\release\bundle\nsis\*.exe
          if-no-files-found: error
